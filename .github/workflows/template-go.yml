name: "🔵 Template · Go"

on:
  workflow_call:
    inputs:
      service-name:
        description: "Microservice name (used for image tag and labels)"
        required: true
        type: string
      working-dir:
        description: "Path to the service in the repo (e.g. ms/auth-service)"
        required: true
        type: string
      go-version:
        description: "Go version"
        required: false
        type: string
        default: "1.23"
      push-image:
        description: "Whether to build and push the Docker image"
        required: false
        type: boolean
        default: false
      ecr-registry:
        description: "ECR registry URL (no trailing slash)"
        required: false
        type: string
        default: ""
      environment:
        description: "Target environment (DEV, STG, PRD) for AWS secret resolution"
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_SESSION_TOKEN:
        required: false

jobs:
  go-ms:
    name: "🔵 ${{ inputs.service-name }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔧 Setup Go ${{ inputs.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: ${{ inputs.working-dir }}/go.sum

      - name: 📦 Download modules
        working-directory: ${{ inputs.working-dir }}
        env:
          GOPROXY: https://proxy.golang.org
        run: |
          go mod tidy
          go mod download

      - name: 🔍 Lint (golangci-lint)
        working-directory: ${{ inputs.working-dir }}
        env:
          GOPROXY: https://proxy.golang.org
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run

      - name: 🔍 SAST (gosec)
        working-directory: ${{ inputs.working-dir }}
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity high ./...

      - name: 🔍 SCA (trivy fs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ inputs.working-dir }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: 🧪 Test
        working-directory: ${{ inputs.working-dir }}
        run: go test ./...

      - name: 🔧 Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id:     ${{ secrets[format('AWS_ACCESS_KEY_ID_{0}', inputs.environment)] }}
          aws-secret-access-key: ${{ secrets[format('AWS_SECRET_ACCESS_KEY_{0}', inputs.environment)] }}
          aws-session-token:     ${{ secrets[format('AWS_SESSION_TOKEN_{0}', inputs.environment)] }}
          aws-region: us-east-1

      - name: 🐳 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🐳 Build Image
        working-directory: ${{ inputs.working-dir }}
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ inputs.service-name }}
          IMAGE_TAG: v1.0.0-${{ github.sha }}-${{ inputs.environment }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .

      - name: 🛡️ Scan image vulnerabilities (trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ inputs.service-name }}:v1.0.0-${{ github.sha }}-${{ inputs.environment }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: 🐳 Push Image
        working-directory: ${{ inputs.working-dir }}
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ inputs.service-name }}
          IMAGE_TAG: v1.0.0-${{ github.sha }}-${{ inputs.environment }}
        run: |
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: 📝 Update Image Tag in values.yaml
        working-directory: ms/${{ inputs.service-name }}/deploy
        env:
          IMAGE_TAG: v1.0.0-${{ github.sha }}-${{ inputs.environment }}
        run: |
          yq -i '.image.tag = env(IMAGE_TAG)' values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add values.yaml
          git commit -m "chore: update image tag to ${IMAGE_TAG}" || true
          attempt=0
          while ! git push; do
            attempt=$((attempt + 1))
            if [ $attempt -ge 3 ]; then
              echo "Push failed after 3 attempts"
              exit 1
            fi
            echo "Push rejected, retrying in $((attempt * 5))s... (attempt $attempt/5)"
            sleep $((attempt * 5))
            git pull --rebase --autostash origin $(basename $GITHUB_REF) || true
          done