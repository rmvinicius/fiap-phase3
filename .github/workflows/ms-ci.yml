name: ms-ci

on:
  push:
    branches: [ develop, staging, main ]
    paths:
      - 'ms/analytics-service/**'
      - 'ms/auth-service/**'
      - 'ms/evaluation-service/**'
      - 'ms/flag-service/**'
      - 'ms/targeting-service/**'
      - '.github/workflows/ms-ci.yml'
      - '.github/workflows/reusable-python-ms.yml'
      - '.github/workflows/reusable-go-ms.yml'
  pull_request:
    branches: [ develop, staging, main ]
    paths:
      - 'ms/analytics-service/**'
      - 'ms/auth-service/**'
      - 'ms/evaluation-service/**'
      - 'ms/flag-service/**'
      - 'ms/targeting-service/**'
      - '.github/workflows/ms-ci.yml'
      - '.github/workflows/reusable-python-ms.yml'
      - '.github/workflows/reusable-go-ms.yml'
  workflow_dispatch:
    inputs:
      service:
        description: "Which service to run"
        required: true
        type: choice
        options:
          - all
          - analytics-service
          - auth-service
          - evaluation-service
          - flag-service
          - targeting-service

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  # ===========================================================================
  # Detect which services changed (Option B: dorny/paths-filter)
  # Runs once per workflow, feeds outputs to the 5 service jobs.
  # ===========================================================================
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      analytics:  ${{ steps.filter.outputs.analytics }}
      auth:       ${{ steps.filter.outputs.auth }}
      evaluation: ${{ steps.filter.outputs.evaluation }}
      flag:       ${{ steps.filter.outputs.flag }}
      targeting:  ${{ steps.filter.outputs.targeting }}
    steps:
      - name: 📥 Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔍 Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            analytics:
              - 'ms/analytics-service/**'
            auth:
              - 'ms/auth-service/**'
            evaluation:
              - 'ms/evaluation-service/**'
            flag:
              - 'ms/flag-service/**'
            targeting:
              - 'ms/targeting-service/**'

  # ===========================================================================
  # Python services
  # ===========================================================================
  analytics-service:
    name: "🐍 analytics-service"
    needs: changes
    if: |
      needs.changes.outputs.analytics == 'true'
      || (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'analytics-service'))
    uses: ./.github/workflows/reusable-python-ms.yml
    with:
      service-name: analytics-service
      working-dir: ms/analytics-service
      push-image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      ecr-registry: ${{ env.ECR_REGISTRY }}
    secrets: inherit

  flag-service:
    name: "🐍 flag-service"
    needs: changes
    if: |
      needs.changes.outputs.flag == 'true'
      || (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'flag-service'))
    uses: ./.github/workflows/reusable-python-ms.yml
    with:
      service-name: flag-service
      working-dir: ms/flag-service
      push-image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      ecr-registry: ${{ env.ECR_REGISTRY }}
    secrets: inherit

  targeting-service:
    name: "🐍 targeting-service"
    needs: changes
    if: |
      needs.changes.outputs.targeting == 'true'
      || (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'targeting-service'))
    uses: ./.github/workflows/reusable-python-ms.yml
    with:
      service-name: targeting-service
      working-dir: ms/targeting-service
      push-image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      ecr-registry: ${{ env.ECR_REGISTRY }}
    secrets: inherit

  # ===========================================================================
  # Go services
  # ===========================================================================
  auth-service:
    name: "🔵 auth-service"
    needs: changes
    if: |
      needs.changes.outputs.auth == 'true'
      || (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'auth-service'))
    uses: ./.github/workflows/reusable-go-ms.yml
    with:
      service-name: auth-service
      working-dir: ms/auth-service
      push-image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      ecr-registry: ${{ env.ECR_REGISTRY }}
    secrets: inherit

  evaluation-service:
    name: "🔵 evaluation-service"
    needs: changes
    if: |
      needs.changes.outputs.evaluation == 'true'
      || (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'evaluation-service'))
    uses: ./.github/workflows/reusable-go-ms.yml
    with:
      service-name: evaluation-service
      working-dir: ms/evaluation-service
      push-image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      ecr-registry: ${{ env.ECR_REGISTRY }}
    secrets: inherit
