name: "🌍 Terraform Plan/Apply"

on:
  push:
    branches: [ develop, staging, main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci.yml'
  pull_request:
    branches: [ develop, staging, main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [ DEV, STG, PRD ]
        default: DEV

jobs:
  terraform-plan:
    name: "📋 Terraform Plan · ${{ github.ref_name }}"
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "us-east-1"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔍 Resolve environment
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV_VAL="${{ inputs.environment }}"
          else
            case "${{ github.ref_name }}" in
              develop) ENV_VAL=DEV ;;
              staging)  ENV_VAL=STG ;;
              main)     ENV_VAL=PRD ;;
            esac
          fi
          echo "ENV=${ENV_VAL}" >> "$GITHUB_OUTPUT"
          echo "ENV_LOWER=$(echo "${ENV_VAL}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: 🔧 Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets[format('AWS_ACCESS_KEY_ID_{0}', steps.resolve.outputs.ENV)] }}
          aws-secret-access-key: ${{ secrets[format('AWS_SECRET_ACCESS_KEY_{0}', steps.resolve.outputs.ENV)] }}
          aws-session-token: ${{ secrets[format('AWS_SESSION_TOKEN_{0}', steps.resolve.outputs.ENV)] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔍 Tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: 📋 Show tflint version
        working-directory: terraform
        run: tflint --version

      - name: 🔧 Tflint init
        working-directory: terraform
        run: tflint --init

      - name: 🔍 Tflint validate
        working-directory: terraform
        run: tflint -f compact
        continue-on-error: true

      - name: 🛡️ Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          quiet: true
          framework: terraform
          output_format: cli
          output_file_path: console,terraform/.checkov/report.txt
        continue-on-error: true

      - name: 🔧 Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: 🔧 Init
        working-directory: terraform
        run: terraform init -backend-config="bootstrap/remote/${{ steps.resolve.outputs.ENV_LOWER }}-backend.tfvars"

      - name: ✅ Validate
        working-directory: terraform
        run: terraform validate

      - name: 📋 Plan
        working-directory: terraform
        run: terraform plan -var-file="environment/${{ steps.resolve.outputs.ENV_LOWER }}.tfvars" -out=tfplan

      - name: 📤 Upload tfplan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ steps.resolve.outputs.ENV }}
          path: terraform/tfplan
          retention-days: 7
          if-no-files-found: error

      - name: ⚙️ Apply
        if: github.event_name == 'workflow_dispatch'
        working-directory: terraform
        run: terraform apply -auto-approve -var-file="environment/${{ steps.resolve.outputs.ENV_LOWER }}.tfvars"
