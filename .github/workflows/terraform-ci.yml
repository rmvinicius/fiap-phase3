name: terraform

on:
  push:
    branches: [ develop, staging, main ]
  pull_request:
    branches: [ develop, staging, main ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [ dev, stg, prod ]

jobs:
  terraform-plan:
    name: "Terraform Plan · ${{ steps.resolve.outputs.TF_ENV }}"
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "us-east-1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve environment
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ENV=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.ref_name }}" in
              develop) echo "ENV=dev"  >> "$GITHUB_OUTPUT" ;;
              staging) echo "ENV=stg"  >> "$GITHUB_OUTPUT" ;;
              main)    echo "ENV=prod" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets[format('AWS_ACCESS_KEY_ID_{0}', steps.resolve.outputs.ENV)] }}
          aws-secret-access-key: ${{ secrets[format('AWS_SECRET_ACCESS_KEY_{0}', steps.resolve.outputs.ENV)] }}
          aws-session-token: ${{ secrets[format('AWS_SESSION_TOKEN_{0}', steps.resolve.outputs.ENV)] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Init
        working-directory: terraform
        run: terraform init -backend-config="bootstrap/remote/${{ steps.resolve.outputs.ENV }}-backend.tfvars"

      - name: Validate
        working-directory: terraform
        run: terraform validate

      - name: Plan
        working-directory: terraform
        run: terraform plan -var-file="environment/${{ steps.resolve.outputs.ENV }}.tfvars" -no-color

      - name: Apply
        if: github.event_name == 'workflow_dispatch'
        working-directory: terraform
        run: terraform apply -auto-approve -var-file="environment/${{ steps.resolve.outputs.ENV }}.tfvars"