name: auth-service
namespace: application

port: 8001
replicas: 1

resources:
  limits:
    cpu: "200m"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "256Mi"

image:
  repository: 076892642827.dkr.ecr.us-east-1.amazonaws.com/toggle-master
  name: auth-service
  tag: "1.0"
  pullPolicy: IfNotPresent

configmap:
  PORT: "8001"

secrets: {}

probes:
  startup:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 9
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

service:
  type: ClusterIP

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  averageCpuUtilization: 10
  averageMemoryUtilization: 10

keda:
  enabled: true
  type: aws-sqs-queue
  minReplicaCount: 0
  maxReplicaCount: 5
  cooldownPeriod: 30
  pollingInterval: 10
  queueLength: "5"
  awsRegion: "us-east-1"
  queueURL: "queue-toggle-master"
  awsAccessKeyId: ""
  awsSecretAccessKey: ""
  awsSessionToken: ""
