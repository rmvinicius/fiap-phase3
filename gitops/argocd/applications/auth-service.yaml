apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rmvinicius/fiap-phase3.git
    targetRevision: develop
    path: helm/microservice
    helm:
      valueFiles:
        - ../../ms/auth-service/deploy/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true