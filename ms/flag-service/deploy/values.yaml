name: flag-service
namespace: application
port: 8002
replicas: 1
resources:
  limits:
    cpu: "200m"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "256Mi"
image:
  repository: 598450975126.dkr.ecr.us-east-1.amazonaws.com
  name: flag-service
  tag: "v1.0.0-582c2e95cb19cccefabb067a95347d41eab6a6ce-DEV"
  pullPolicy: IfNotPresent
configmap:
  AUTH_SERVICE_URL: "http://auth-service-svc.application.svc.cluster.local:8001"
  PORT: "8002"
secrets:
  DATABASE_URL: cG9zdGdyZXM6Ly9mbGFnX3NlcnZpY2U6ZmxhZ19zZXJ2aWNlMjAyNkByZHMtZGV2LTAyLmNsOHl4ZWZ5NHd4ei51cy1lYXN0LTEucmRzLmFtYXpvbmF3cy5jb206NTQzMi9mbGFnc19kYg==
probes:
  startup:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
